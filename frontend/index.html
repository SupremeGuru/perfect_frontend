<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star sales</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 3fr;
        }
        .sidebar{
            background-color: rgb(237, 241, 244);
            padding: 200px;
            height: 100vh;
        } 
        .sidebar-header{
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header > h1{
            font-size: 16px;
        }
        .content{
            padding: 20px;
        }
        .content-header-container{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(237, 241, 244);
            width: 100%;
        }
        .content-header{
            background-color: rgb(237, 241, 244);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
            <img src="image.jpg" alt="" srcset="">
            <h1>Sellvo</h1>
        </div>
        <div class="content">
            <div></div>>
           <input type="text" placeholder="Search...">
           <div class="content-header">
           <button>View your store</button>
           <img src="" alt="">
        </div>
    </div>
</body>
</html>
