<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Flex Gap</title>
</head>
<style>
    .con{
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: beige;
        padding: 10px;
    }
    .container{
        display: flex;
        flex-wrap: wrap;
        justify-content: end;
        gap: 30px;  
        /* row-gap: 20px; */
        /* column-gap: 30px; */
        /* gap: 20px 30px; */
    }
    .red{
        display: inline;
        background-color: red;
        border: 4px solid black;
        border-radius: 10px;
        padding: 10px;
        color: white;
    }
    .blue{
        background-color: blue;
        border: 4px solid black;
        border-radius: 10px;
        padding: 10px;
        color: white;
    }
    .green{
        background-color: green;
        border: 4px solid black;
        border-radius: 10px;
        padding: 10px;
        color: white;
    }
    .purple{
        background-color: purple;
        border: 4px solid black;
        border-radius: 10px;
        padding: 10px;
        color: white;
    }
</style>
<body>
    <div class="con">
        <span class="red">Home</span>
    <div class="container">
        <span class="blue">About</span>
        <span class="green">Contact</span>
        <span class="purple">Services</span>
    </div>
    </div>

</body>
</html>
