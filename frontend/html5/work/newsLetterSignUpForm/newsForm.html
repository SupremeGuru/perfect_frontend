<body>

    <div class="newsletter-card">
        <h2>Subscribe to Our Newsletter</h2>
        <p>Get weekly updates, curated tech insights, and exclusive resources delivered straight to your inbox.</p>
        
        <!-- Replace the action attribute with your backend processing link -->
        <form action="/your-backend-endpoint" target="_blank"  method="POST" class="subscription-form">
            
            <!-- First Name Field -->
            <div class="form-group">
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" name="first_name" placeholder="John" required>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email-address">Email Address</label>
                <input type="email" id="email-address" name="email" placeholder="john@example.com" required>
            </div>

            <!-- GDPR / Privacy Policy Agreement -->
            <div class="checkbox-group">
                <input type="checkbox" id="privacy-agreement" name="privacy_agreement" required>
                <label for="privacy-agreement">
                    I agree to the privacy policy and consent to receiving marketing emails. I can unsubscribe at any time.
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Subscribe Now</button>
            
        </form>
    </div>

</body>
