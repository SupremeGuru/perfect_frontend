<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Sales</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: Helvetica, sans-serif;
            
        }
        body{
            margin:0;
            padding:0;
        }
        .container{
            display: grid;
            grid-template-columns: 1fr 3fr;
        }
        .sidebar{
            background-color: rgb(237, 241, 244);
            padding: 20px;
            height: 100vh;
        }
        .sidebar-header{
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sidebar-header > h1{
            font-size: 16px;
        }
        .content{
            padding: 20px;
        }
        .content-header-container{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(237, 241, 244);
            width: 100%;
            padding: 10px;
            border-radius: 5px;
        }
        .content-header-container > input{
            background-color: rgb(205, 218, 231);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;}
        .content-header{
            display: flex;
            justify-content: flex-end;
            background-color: rgb(237, 241, 244);
        }.content-header > button{
            background-color: rgb(0, 123, 255);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <img src="./trello_img.png" alt="" srcset="">
            <h1>Sellvo</h1>
            </div>
        </div>
        <div class="content">
            <div class="content-header-container">
                <input type="text" placeholder="Search...">
                <div class="content-header">
                <button>View your store
                    <img src="./akar-icons--arrow-right.svg" width="20" height="20" alt="">
                </button>
                
                <img src="./profile_img.png" alt="" srcset="">
                </div>
            </div>
            <div>
                <h1>Dashboard</h1>
                <p>This is the sales dashboard.</p>
            </div>
        </div>
    </div>
</body>
</html>
