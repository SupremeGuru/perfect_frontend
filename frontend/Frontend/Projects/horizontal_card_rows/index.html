<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizontal Card Rows</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-row">
  <!-- Card 1 -->
  <div class="card">
    <img src="https://placeholder.com" alt="Card Image" class="card-image">
    <div class="card-content">
      <h3 class="card-title">Card Title One</h3>
      <p class="card-description">This is a short description for the first horizontal card item.</p>
      <button class="card-btn">Read More</button>
    </div>
  </div>

  <!-- Card 2 -->
  <div class="card">
    <img src="https://placeholder.com" alt="Card Image" class="card-image">
    <div class="card-content">
      <h3 class="card-title">Card Title Two</h3>
      <p class="card-description">This is a short description for the second horizontal card item.</p>
      <button class="card-btn">Read More</button>
    </div>
  </div>

  <!-- Card 3 -->
  <div class="card">
    <img src="https://placeholder.com" alt="Card Image" class="card-image">
    <div class="card-content">
      <h3 class="card-title">Card Title Three</h3>
      <p class="card-description">This is a short description for the third horizontal card item.</p>
      <button class="card-btn">Read More</button>
    </div>
  </div>
</div>

</body>
</html>
