<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>button css component library</title>
    <style>
        .container{
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .btn{
            padding: 20px;
            border-radius: 20px;
        }
        .btn-lg{
            font-size: 16px;
        }
        .btn-sm{
            font-size: 14px;
        }
        .btn-md{
            font-size: 12px;
        }
        .btn-primary{
            background-color: blue;
            border-color: red;
        }
        .btn-secondary{
            background-color: purple;
            border-color: orange;
        }
        .btn-tertiary{
            background-color: grey;
            border-color: whitesmoke;
        }
        .btn-enhanced{
            background-color: chartreuse;
            border-color: yellow;
        }
        .btn-neutral{
            background-color: aqua;
            border-color: brown;
        }
        .btn-danger{
            background-color: red;
            border-color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn btn-lg btn-primary">Primary</button>
        <button class="btn btn-sm btn-secondary">Secondary</button>
        <button class="btn btn-md btn-tertiary">Tertiary</button>
        <button class="btn btn-lg btn-enhanced">Enhanced</button>
        <button class="btn btn-sm btn-neutral">neutral</button>
        <button class="btn btn-md btn-danger">danger</button>
    </div>
</body>
</html>
