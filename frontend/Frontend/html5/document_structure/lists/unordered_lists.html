<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <h1 style="text-align: center;">Unordered Lists</h1>
    <ul>
        <li>Orange</li>
        <li>Mango</li>
        <li>Apple</li>
        <li>Cucumber</li>
        <li>Pineapple</li>
    </ul>
    <ul>
        <li type="square">Orange</li>
        <li type="square">Mango</li>
        <li type="square">Apple</li>
        <li type="square">Cucumber</li>
        <li type="square">Pineapple</li>
    </ul>
    <ul>
        <li type="circle">Orange</li>
        <li type="circle">Mango</li>
        <li type="circle">Apple</li>
        <li type="circle">Cucumber</li>
        <li type="circle">Pineapple</li>
    </ul>
    <ul>
        <li type="none">Orange</li>
        <li type="none">Mango</li>
        <li type="none">Apple</li>
        <li type="none">Cucumber</li>
        <li type="none">Pineapple</li>
    </ul>
</body>
</html>
