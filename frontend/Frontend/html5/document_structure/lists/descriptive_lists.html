<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descriptive Lists</title>
</head>
<body>
    <h1 style="text-align: center;">Descriptive List</h1>
    <dl type="1" start="2">
        <dt>Yam</dt>
        <dt>Rice</dt>
        <dt>Millet</dt>
        <dt>Beans</dt>
        <dt>Cassava</dt>
    </dl>
    <dl type="A" start="3">
        <dt>Yam</dt>
        <dt>Rice</dt>
        <dt>Millet</dt>
        <dt>Beans</dt>
        <dt>Cassava</dt>
    </dl>
    <dl type="a" start="4">
        <dt>Yam</dt>
        <dt>Rice</dt>
        <dt>Millet</dt>
        <dt>Beans</dt>
        <dt>Cassava</dt>
    </dl>
    <dl type="I" start="5">
        <dt>Yam</dt>
        <dt>Rice</dt>
        <dt>Millet</dt>
        <dt>Beans</dt>
        <dt>Cassava</dt>
    </dl>
    <dl type="i" start="2">
        <dt>Yam</dt>
        <dt>Rice</dt>
        <dt>Millet</dt>
        <dt>Beans</dt>
        <dt>Cassava</dt>
    </dl>
</body>
</html>
