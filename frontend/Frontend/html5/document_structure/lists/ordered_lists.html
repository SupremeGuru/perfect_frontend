<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered Lists</title>
</head>
<body>
    <h1 style="text-align: center;">Ordered Lists</h1>
    <ol type="1" start="2">
        <li>Yam</li>
        <li>Rice</li>
        <li>Millet</li>
        <li>Beans</li>
        <li>Cassava</li>
    </ol>
    <ol type="A" start="3">
        <li>Yam</li>
        <li>Rice</li>
        <li>Millet</li>
        <li>Beans</li>
        <li>Cassava</li>
    </ol>
    <ol type="a" start="4">
        <li>Yam</li>
        <li>Rice</li>
        <li>Millet</li>
        <li>Beans</li>
        <li>Cassava</li>
    </ol>
    <ol type="I" start="5">
        <li>Yam</li>
        <li>Rice</li>
        <li>Millet</li>
        <li>Beans</li>
        <li>Cassava</li>
    </ol>
    <ol type="i" start="2">
        <li>Yam</li>
        <li>Rice</li>
        <li>Millet</li>
        <li>Beans</li>
        <li>Cassava</li>
    </ol>
</body>
</html>
